name: Build & Deploy

on:
  push:
    branches: [master]
  # Cada 1 de enero: vuelve a compilar para que los años que se calculan al compilar se actualicen sin un push
  schedule:
    - cron: '0 12 1 1 *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial y etiquetas: lastmod del sitemap y paridad con legacy-v1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # Astro 7 exige >=22.23.4; el '22' del runner trae una menor
          cache: npm

      - name: Install dependencies
        run: npm ci

      # WeasyPrint para el CV en PDF (tools/cv_pdf.py); pango ya viene en el runner, se asegura por si cambia la imagen
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0
          pip install -r tools/requirements.txt

      - name: Build (Astro + SEO)
        run: npm run build
        env:
          SITE: https://ierwinx.com

      - name: Check
        run: npm run check

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

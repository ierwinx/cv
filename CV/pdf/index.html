      color: #ccc;
      font-size: 13px;
      font-weight: 300;

      width: 100%;
      height: 100%;
      border: none;
      display: none;

    // Builds a circular, high-quality photo. The source is ~3000px, and shrinking it
    // in a single drawImage call aliases badly, so it is halved step by step first.
    async function loadPhoto(src, size) {
      const img = await new Promise((resolve, reject) => {
        const i = new Image();
        i.onload = () => resolve(i);
        i.onerror = reject;
        i.src = src;
      });
      const side = Math.min(img.naturalWidth, img.naturalHeight);
      let cur = document.createElement('canvas');
      cur.width = cur.height = side;
      cur.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, side, side);
      while (cur.width / 2 >= size) {
        const next = document.createElement('canvas');
        next.width = next.height = Math.round(cur.width / 2);
        const ctx = next.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(cur, 0, 0, next.width, next.height);
        cur = next;
      }
      const out = document.createElement('canvas');
      out.width = out.height = size;
      const ctx = out.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, size, size);
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
      ctx.clip();
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(cur, 0, 0, size, size);
      return out.toDataURL('image/jpeg', 0.95);
    }

          photo.width * pxToMM, photo.height * pxToMM);
      }

      const blob = doc.output('blob');
      const url = URL.createObjectURL(blob);

      const frame = document.getElementById('pdf-frame');
      frame.src = url;
      frame.style.display = 'block';
      document.getElementById('loader').style.display = 'none';
      el.style.display = 'none';
    });
  </script>
</body>
</html>
